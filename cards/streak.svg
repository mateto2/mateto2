<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Sequência atual de 2 dias; maior sequência 3; 40 contribuições"><title>Sequência atual de 2 dias; maior sequência 3; 40 contribuições</title><style>
.serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif} .sans{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .mono{font-family:'Geist Mono',ui-monospace,'Cascadia Code',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(5px)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}

    .c1{animation:rise .7s ease-out .2s both}.c3{animation:rise .7s ease-out .5s both}
    .ring{--len:301.6;stroke-dasharray:301.6;animation:draw 1.2s ease-out .3s both}
    .fire{animation:pop .6s ease-out 1.3s both;transform-box:fill-box;transform-origin:center}
    .lb{animation:fade .8s ease-out .9s both}
