<svg xmlns="http://www.w3.org/2000/svg" width="433" height="150" viewBox="0 0 433 150" role="img" aria-label="Repositório bi-inflacao-brasil"><title>Repositório bi-inflacao-brasil</title><style>
.serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif} .sans{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .mono{font-family:'Geist Mono',ui-monospace,'Cascadia Code',Consolas,monospace}
.ink{fill:#1C1B19} .muted{fill:#6B665C}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(5px)}}
@keyframes swing{0%{opacity:0;transform:translateY(60px) rotate(-6deg)}65%{opacity:1;transform:translateY(-6px) rotate(1.5deg)}100%{opacity:1;transform:none}}
.rc{animation:rise .8s ease-out 0.4s both}.ar{animation:nudge 3s ease-in-out 1.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="cp"><rect x="1" y="1" width="431" height="148" rx="16"/></clipPath></defs><g class="rc"><rect x="1" y="1" width="431" height="148" rx="16" fill="#F6F1E7" stroke="#D9D0BE" stroke-width="1.5"/><rect x="0" y="0" width="9" height="150" fill="#F2B705" clip-path="url(#cp)"/><text x="30" y="46" class="serif" font-size="27" fill="#1C1B19">bi-inflacao-brasil <tspan class="ar sans" font-size="18">↗</tspan></text><text x="30" y="80" class="sans" font-size="14.5" fill="#6B665C">BI da inflação no Brasil (2021–2026) com dados do</text><text x="30" y="101" class="sans" font-size="14.5" fill="#6B665C">IBGE, BCB e Ipeadata.</text><circle cx="36" cy="126" r="5" fill="#F2B705"/><text x="48" y="131" class="mono" font-size="12.5" fill="#1C1B19">Jupyter · Power BI</text></g></svg>