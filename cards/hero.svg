<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Matheus Amaral — estudante de Ciência da Computação"><title>Matheus Amaral — estudante de Ciência da Computação</title><style>
.serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif} .sans{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .mono{font-family:'Geist Mono',ui-monospace,'Cascadia Code',Consolas,monospace}
.ink{fill:#1C1B19} .muted{fill:#6B665C}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(5px)}}
@keyframes swing{0%{opacity:0;transform:translateY(60px) rotate(-6deg)}65%{opacity:1;transform:translateY(-6px) rotate(1.5deg)}100%{opacity:1;transform:none}}

    .l1{animation:rise .8s ease-out .1s both}.l2{animation:rise .8s ease-out .35s both}
    .l3{animation:rise .8s ease-out .6s both}.l4{animation:fade 1s ease-out 1s both}
    .dot{animation:pulse 1.8s ease-out 1.2s infinite;transform-box:fill-box;transform-origin:center}
    .ar{animation:nudge 3s ease-in-out 2s infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="1" y="1" width="878" height="298" rx="18" fill="#F6F1E7" stroke="#D9D0BE" stroke-width="1.5"/><defs><linearGradient id="nm" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#1C1B19"/><stop offset=".42" stop-color="#1C1B19"/><stop offset=".5" stop-color="#0E9F6E"/><stop offset=".58" stop-color="#1C1B19"/><stop offset="1" stop-color="#1C1B19"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;.35;1" dur="5s" begin="1.6s" repeatCount="indefinite"/></linearGradient></defs><text x="56" y="70" class="mono muted l1" font-size="14" letter-spacing="2">OLÁ, EU SOU</text><text x="52" y="150" class="serif l2" font-size="84" fill="#1C1B19">Matheus <tspan font-style="italic" fill="url(#nm)">Amaral</tspan></text><text x="56" y="196" class="sans l3" font-size="21" fill="#1C1B19">Estudante de Ciência da Computação — desenvolvimento web &amp; análise de dados.</text><g class="l4"><circle cx="62" cy="244" r="5" fill="#0E9F6E"/><circle class="dot" cx="62" cy="244" r="5" fill="#0E9F6E"/><text x="78" y="249" class="sans" font-size="15" fill="#6B665C">Aprendendo na prática, um projeto por vez</text><text x="824" y="249" class="mono" font-size="14" fill="#1C1B19" text-anchor="end">35 contribuições no último ano <tspan class="ar">→</tspan></text></g><g class="l3"><circle cx="760" cy="80" r="26" fill="#2F5BEA" opacity=".9"/><circle cx="800" cy="80" r="26" fill="#F2B705" opacity=".9"/><circle cx="780" cy="112" r="26" fill="#E4572E" opacity=".85"/></g></svg>