<svg xmlns="http://www.w3.org/2000/svg" width="433" height="150" viewBox="0 0 433 150" role="img" aria-label="Repositório bi-inflacao-brasil"><title>Repositório bi-inflacao-brasil</title><style>
.serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif} .sans{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .mono{font-family:'Geist Mono',ui-monospace,'Cascadia Code',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(5px)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.rc{animation:rise .8s ease-out 0.4s both}.ar{animation:nudge 3s ease-in-out 1.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="cp"><rect x="1" y="1" width="431" height="148" rx="14"/></clipPath></defs><g class="rc"><rect x="1" y="1" width="431" height="148" rx="14" fill="none" stroke="#30363D" stroke-width="1.5"/><rect x="0" y="0" width="7" height="150" fill="#F2B705" clip-path="url(#cp)"/><text x="28" y="46" class="serif" font-size="27" fill="#E6EDF3">bi-inflacao-brasil <tspan class="ar sans" font-size="18">↗</tspan></text><text x="28" y="80" class="sans" font-size="14.5" fill="#8B949E">BI da inflação no Brasil (2021–2026) com dados do</text><text x="28" y="101" class="sans" font-size="14.5" fill="#8B949E">IBGE, BCB e Ipeadata.</text><circle cx="34" cy="126" r="5" fill="#F2B705"/><text x="46" y="131" class="mono" font-size="12.5" fill="#E6EDF3">Jupyter · Power BI</text></g></svg>