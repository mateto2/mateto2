.serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif} .sans{font-family:'Geist','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .mono{font-family:'Geist Mono',ui-monospace,'Cascadia Code',Consolas,monospace}
